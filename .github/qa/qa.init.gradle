// Gradle init script for QA runs (applied with --init-script, build.gradle stays untouched).
//   QA_MAX_RETRIES  retries per failed test; a test that passes on retry is reported as flaky.
// Quarantine is NOT applied here (Gradle filters don't reach classes inside JUnit suites):
// report.py separates known failures from new ones and owns the gate.
initscript {
    repositories { gradlePluginPortal() }
    dependencies { classpath 'org.gradle:test-retry-gradle-plugin:1.6.6' }
}

def retries = (System.getenv('QA_MAX_RETRIES') ?: '0') as int

rootProject {
    apply plugin: org.gradle.testretry.TestRetryPlugin
    tasks.withType(Test).configureEach { t ->
        t.retry {
            maxRetries = retries
            failOnPassedAfterRetry = false
        }
    }
}
