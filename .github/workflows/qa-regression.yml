name: QA · Regression

# Validates "main works": full DB-only regression (Etendo's StandaloneTestSuite), built once and
# fanned out to ordered, time-balanced shards that restore the same DB snapshot.
# Runs on every push to main (rolling: each green run marks a releasable commit, see
# .github/qa/last-green.sh), nightly, on demand, and from PRs labelled `qa:full` or graded high risk.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1-5"   # 03:00 UTC, weekdays
  workflow_dispatch:
    inputs:
      shards:
        description: Parallel shards
        default: "4"
  workflow_call:
    inputs:
      shards:
        type: string
        default: "4"

concurrency:
  group: qa-regression-${{ github.ref }}
  # On main, never cancel a running check: queue the newest push instead (rolling verification).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build once + plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: syspass, LANG: en_US.utf8 }  # English server messages
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/etendo-env
        with:
          github-user: ${{ secrets.ETENDO_GITHUB_USER }}
          github-token: ${{ secrets.ETENDO_GITHUB_TOKEN }}
          nexus-user: ${{ secrets.ETENDO_NEXUS_USER }}
          nexus-password: ${{ secrets.ETENDO_NEXUS_PASSWORD }}

      - name: Build Etendo (expandCore, setup, install)
        run: |
          yes Y | ./gradlew expandCore --console=plain
          ./gradlew setup --console=plain < /dev/null
          ./gradlew install --console=plain < /dev/null

      - name: Plan shards
        id: plan
        run: |
          python3 .github/qa/build-suites.py build/qa/suites
          echo "matrix=$(python3 .github/qa/plan-shards.py build/qa/suites/regression-db.txt \
            .github/qa/timings.json ${{ inputs.shards || '4' }} build/qa/shards)" >> "$GITHUB_OUTPUT"

      - name: Snapshot DB + workspace
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -Fc etendo > "$RUNNER_TEMP/etendo.dump"
          tar --exclude=./.git --exclude=./WebContent --exclude=./referencedata \
              --exclude='./${env.CATALINA_HOME}' --exclude=./build/test-results --exclude=./build/reports \
              -cf - . | zstd -T0 -3 -o "$RUNNER_TEMP/workspace.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: etendo-build
          path: |
            ${{ runner.temp }}/workspace.tar.zst
            ${{ runner.temp }}/etendo.dump
          retention-days: 2

  shard:
    name: Shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: syspass, LANG: en_US.utf8 }  # English server messages
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/etendo-restore
        with: { pg-container: "${{ job.services.postgres.id }}" }

      - name: Run shard
        env: { QA_GRADLE_ARGS: "-x compileJava" }
        run: .github/qa/run-tests.sh build/qa/shards/shard-${{ matrix.shard }}.txt || true   # gated in report job

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-shard-${{ matrix.shard }}
          path: build/test-results/test/*.xml
          if-no-files-found: warn

  report:
    name: Aggregate report + AI triage
    needs: [build, shard]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: results-shard-*, path: build/shards }

      - name: Aggregate (quarantine- and floor-aware)
        run: |
          set +e
          python3 .github/qa/report.py --gate --floor regression --title "QA · Regression" --out build/qa build/shards > /dev/null
          echo "GATE=$?" >> "$GITHUB_ENV"
          cat build/qa/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "FAILED=$(python3 -c "import json;print(len(json.load(open('build/qa/failures.json'))['failures']))")" >> "$GITHUB_ENV"

      - name: Fetch Etendo sources for triage
        if: env.FAILED != '0' && env.HAS_AI == 'true'
        uses: actions/download-artifact@v4
        with: { name: etendo-build, path: "${{ runner.temp }}/etendo-build" }

      - name: AI triage
        if: env.FAILED != '0' && env.HAS_AI == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}            # API billing; wins if both are set
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # or a subscription token from `claude setup-token`
        run: |
          zstd -dc "$RUNNER_TEMP/etendo-build/workspace.tar.zst" | tar -xf - --exclude=./build/qa
          npm install -g @anthropic-ai/claude-code
          .github/qa/ai/triage.sh build/qa/failures.json - build/qa
          cat build/qa/triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Flaky tests → issues
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/qa/flaky-issues.sh build/qa/failures.json "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open / update tracking issue
        if: (github.event_name == 'schedule' || github.event_name == 'push') && env.GATE != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="QA regression failing on main"
          { cat build/qa/summary.md; echo; cat build/qa/triage.md 2>/dev/null || true
            echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.md
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -F body.md; else gh issue create -t "$title" -F body.md; fi

      - name: Upload report (includes refreshed timings.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-report
          path: build/qa/

      - name: Gate (new failures or lost tests)
        if: env.GATE != '0'
        run: exit 1
